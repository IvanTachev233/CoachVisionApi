# gitleaks reads this from the repo root: the default rules, plus skipping local
# virtual environments so that `gitleaks dir .` looks only at this project's files.
[extend]
useDefault = true

[[allowlists]]
description = "Local virtual environments, ignored by git"
paths = ['''(^|/)\.venv/''']

[[allowlists]]
description = "OpenTofu's downloads, ignored by git: providers and a full copy of the LiftBig repo per module"
paths = ['''(^|/)\.terraform/''']
